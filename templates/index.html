<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Analizador de imágenes
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <!-- ==========================================
         HEADER
         ========================================== -->

    <header class="header">

        <div class="header-container">

            <a
                href="/"
                class="header-brand"
            >

                <div class="header-brand-icon">
                    UNAM
                </div>

                <span>
                    MUSEO UNAM HOY
                </span>

            </a>


            <div class="header-actions">

                <a
                    href="#"
                    class="header-icon"
                    title="Inicio"
                >
                    🏠
                </a>

                <a
                    href="#"
                    class="header-icon"
                    title="LLaVA"
                >
                    👁️
                </a>

            </div>

        </div>

    </header>



    <!-- ==========================================
         CONTENIDO
         ========================================== -->

    <main class="container">


        <h1>
            Analizador de imágenes
        </h1>


        <p class="subtitle">

            Selecciona una fotografía para analizarla
            utilizando LLaVA.

        </p>


        <section
            class="card"
            id="analysis-section"
        >


            <div class="form-group">

                <label>
                    Selecciona una fotografía
                </label>


                <!-- ==================================
                     CARRUSEL
                     ================================== -->

                <div
                    class="carousel"
                    id="carousel"
                >

                    <button
                        type="button"
                        class="carousel-button"
                        id="prev-button"
                    >
                        ❮
                    </button>


                    <div
                        class="carousel-track-container"
                    >

                        <div
                            class="carousel-track"
                            id="carousel-track"
                        >

                            <!--
                                Las 20 imágenes
                                se generan desde app.js
                            -->

                        </div>

                    </div>


                    <button
                        type="button"
                        class="carousel-button"
                        id="next-button"
                    >
                        ❯
                    </button>

                </div>


            </div>


            <!-- ==================================
                 VISTA PREVIA
                 ================================== -->

            <div
                class="preview-container"
                id="preview-container"
                hidden
            >

                <img
                    id="image-preview"
                    alt="Imagen seleccionada"
                >

            </div>


            <!-- ==================================
                 PROMPT
                 ================================== -->

            <!-- <div class="form-group">

                <label for="prompt">

                    Prompt

                </label>


                <textarea
                    id="prompt"
                    placeholder="Escribe qué quieres analizar..."
                >Determina la edad aproximada y la emoción de la persona en la imagen.</textarea>

            </div> -->


            <button
                type="button"
                id="analyze-button"
            >

                Analizar fotografía

            </button>


        </section>



        <!-- ======================================
             LOADING
             ====================================== -->

        <div
            id="loading"
            class="loading"
            hidden
        >

            <div class="loading-spinner"></div>

            <span>
                Analizando imagen...
            </span>

        </div>



        <!-- ======================================
             ERROR
             ====================================== -->

        <div
            id="error"
            class="error"
            hidden
        ></div>



        <!-- ======================================
             RESULTADO
             ====================================== -->

        <section
            class="card result-card"
            id="result-container"
            hidden
        >

            <h2>
                Resultado
            </h2>


            <div
                id="summary"
                class="result-analysis"
            ></div>


            <div class="result-metadata">

                <div>

                    <strong>
                        Tiempo LLaVA:
                    </strong>

                    <span id="ollama-time"></span>

                    segundos

                </div>


                <div>

                    <strong>
                        Tiempo total:
                    </strong>

                    <span id="client-time"></span>

                    segundos

                </div>

            </div>


            <!-- <details>

                <summary>
                    Ver JSON
                </summary>


                <pre id="json-result"></pre>

            </details> -->


        </section>


    </main>



    <!-- ==========================================
         FOOTER
         ========================================== -->

    <footer class="footer">

        <div class="footer-container">

            <p class="footer-text">
                AI Analyzer © 2026
            </p>


            <div class="footer-links">

                <a
                    href="#"
                    class="footer-link"
                >
                    Inicio
                </a>


                <a
                    href="#"
                    class="footer-link"
                >
                    Acerca de
                </a>

            </div>

        </div>

    </footer>



    <script
        src="{{ url_for('static', filename='app.js') }}"
    ></script>


</body>

</html>
